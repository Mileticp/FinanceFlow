name: Bootstrap pinned frontend vendor and versioned shell
on:
  push:
    branches: [security/frontend-hardening-20261106]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Supabase UMD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 --silent --show-error \
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js' \
            --output vendor/supabase.min.js
          test "$(wc -c < vendor/supabase.min.js)" -gt 10000
          grep -q 'createClient' vendor/supabase.min.js
      - name: Generate versioned shell
        run: npm run build:shell
      - name: Validate shell
        run: npm run check:shell
      - name: Commit verified vendor and shell artifacts to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/supabase.min.js shell index.html sw.js shell-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: vendor pinned Supabase 2.118.0 and regenerate immutable shell'
            git push origin HEAD:security/frontend-hardening-20261106
          fi
