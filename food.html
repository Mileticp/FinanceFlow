<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="./manifest.webmanifest"><title>Food & Weight — FinanceFlow</title><style>:root{font:15px system-ui;color:#eef2ff;background:#090e1b}*{box-sizing:border-box}body{margin:0}main{max-width:940px;margin:auto;padding:20px 14px 80px}a{color:#a6a8ff}.card{background:#141d30;border:1px solid #30405a;border-radius:14px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#9cabc5}input,select,button,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #40516d;background:#0d1526;color:white;max-width:100%}input,select,textarea{width:100%}button{background:#696bdb;cursor:pointer;border:0}button:disabled{opacity:.5}label{display:block;margin:8px 0}label span{display:block;color:#acb9d3;margin-bottom:5px}.hidden{display:none}.big{font-size:26px;font-weight:750}.item{padding:11px 0;border-bottom:1px solid #30405a}.danger{color:#ffaaa8}.good{color:#7ae3b6}</style></head><body><main><header class="row"><a href="./">← FinanceFlow</a><h1>Food & Weight</h1></header><section id="auth" class="card hidden"><h2>Sign in</h2><form id="login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button></form><p id="authMsg" class="danger"></p></section><section id="app" class="hidden"><div class="card row"><button id="prev">←</button><input id="day" type="date" style="width:auto"><button id="next">→</button><button id="today">Today</button><button id="logout" style="margin-left:auto">Sign out</button></div><div class="grid"><div class="card"><div class="muted">Calories</div><div id="calTotal" class="big">0</div><label>Daily target<input id="targetCal" type="number" min="1" value="2000"></label></div><div class="card"><div class="muted">Protein</div><div id="proteinTotal" class="big">0 g</div><label>Daily target (g)<input id="targetProtein" type="number" min="1" value="120"></label></div><div class="card"><div class="muted">Weight</div><div id="weightTotal" class="big">—</div><form id="weightForm" class="row"><input id="weight" type="number" min="1" max="499" step=".01" placeholder="kg" required style="width:110px"><button>Save</button></form><small id="weightMsg"></small></div></div><div class="card"><h2 id="formTitle">Log food</h2><label>Quick add<select id="preset"><option value="">Choose food…</option><option value="Tuna in water|56 g|62|14.6">Tuna (56 g)</option><option value="Skyr|100 g|58|10">Skyr (100 g)</option><option value="Egg whites|100 g|43|9.8">Egg whites (100 g)</option><option value="Forest berries|100 g|28|0">Forest berries (100 g, protein unknown)</option><option value="Protein shake|1 bottle|310|50">Protein shake (310 kcal, 50 g)</option><option value="Protein powder|30 g|113.1|23.7">Protein powder (30 g)</option></select></label><form id="foodForm"><div class="grid"><label><span>Food name</span><input id="food" required maxlength="160"></label><label><span>Quantity</span><input id="quantity" placeholder="e.g. 300 g"></label><label><span>Meal</span><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Other</option></select></label><label><span>Calories</span><input id="calories" type="number" step=".01" min="0" required></label><label><span>Protein (g)</span><input id="protein" type="number" step=".01" min="0" required></label></div><label><span>Notes</span><textarea id="notes" rows="2"></textarea></label><label class="row"><input id="estimated" type="checkbox" style="width:auto"> Estimated values</label><div class="row"><button id="saveFood">Save food</button><button id="cancel" type="button" class="hidden">Cancel edit</button><span id="foodMsg"></span></div></form></div><div class="card"><h2>Food diary</h2><div id="entries">Loading…</div></div><div class="card"><h2>Recent weights</h2><div id="weights"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id),db=window.supabase?.createClient('https://udpfhznurxgbiqlhnulf.supabase.co','sb_publishable_vWEzwP9OMGIJXySl5SFMIA_lV1aTTuw',{auth:{persistSession:true,autoRefreshToken:true}});let user=null,logs=[],weights=[],editId=null;const fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('day').value=fmt(new Date());const msg=(id,s,bad=false)=>{$(id).textContent=s;$(id).className=bad?'danger':'good'};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function reset(){editId=null;$('foodForm').reset();$('formTitle').textContent='Log food';$('cancel').classList.add('hidden');$('preset').value=''}function render(){const sum=k=>logs.reduce((a,x)=>a+Number(x[k]||0),0);$('calTotal').textContent=sum('calories').toFixed(0)+' / '+$('targetCal').value+' kcal';$('proteinTotal').textContent=sum('protein_g').toFixed(1)+' / '+$('targetProtein').value+' g';$('entries').innerHTML=logs.length?logs.map(x=>'<div class="item"><b>'+safe(x.food_name)+'</b> · '+safe(x.meal)+' <span class="muted">'+safe(x.quantity)+'</span><div>'+Number(x.calories)+' kcal · '+Number(x.protein_g)+' g protein '+(x.estimated?'(estimate)':'')+'</div><div class="muted">'+safe(x.notes)+'</div><button data-edit="'+safe(x.id)+'">Edit</button> <button data-delete="'+safe(x.id)+'">Delete</button></div>').join(''):'No food logged for this date.';const w=weights.find(x=>x.logged_on===$('day').value);$('weightTotal').textContent=w?Number(w.weight_kg)+' kg':'—';$('weights').innerHTML=weights.slice(0,15).map(x=>'<div class="item">'+safe(x.logged_on)+' — '+Number(x.weight_kg)+' kg</div>').join('')||'No weights logged yet.'}async function load(){if(!user)return;const [a,b]=await Promise.all([db.from('food_logs').select('*').eq('user_id',user.id).eq('logged_on',$('day').value).order('created_at'),db.from('weight_logs').select('*').eq('user_id',user.id).order('logged_on',{ascending:false}).limit(100)]);if(a.error||b.error){$('entries').textContent='Loading failed: '+(a.error||b.error).message;return}logs=a.data;weights=b.data;render()}$('preset').onchange=()=>{if(!$('preset').value)return;const [name,qty,cal,pro]=$('preset').value.split('|');$('food').value=name;$('quantity').value=qty;$('calories').value=cal;$('protein').value=pro;$('estimated').checked=false};$('entries').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;const x=logs.find(v=>v.id===id);if(!x)return;if(e.target.dataset.delete){if(!confirm('Delete this food entry?'))return;const r=await db.from('food_logs').delete().eq('id',id).eq('user_id',user.id);if(r.error)alert(r.error.message);else await load();return}editId=id;$('formTitle').textContent='Edit food';for(const [field,key] of [['food','food_name'],['quantity','quantity'],['meal','meal'],['calories','calories'],['protein','protein_g'],['notes','notes']])$(field).value=x[key]??'';$('estimated').checked=x.estimated;$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=reset;$('foodForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const payload={logged_on:$('day').value,meal:$('meal').value,food_name:$('food').value.trim(),quantity:$('quantity').value.trim(),calories:Number($('calories').value),protein_g:Number($('protein').value),estimated:$('estimated').checked,notes:$('notes').value.trim()};if(!payload.food_name||!Number.isFinite(payload.calories)||payload.calories<0||!Number.isFinite(payload.protein_g)||payload.protein_g<0)return;const btn=$('saveFood');btn.disabled=true;try{const r=editId?await db.from('food_logs').update(payload).eq('id',editId).eq('user_id',user.id):await db.from('food_logs').insert({...payload,user_id:user.id});if(r.error)throw r.error;reset();msg('foodMsg','Saved to Supabase');await load()}catch(err){msg('foodMsg',err.message,true)}finally{btn.disabled=false}};$('weightForm').onsubmit=async e=>{e.preventDefault();const r=await db.from('weight_logs').upsert({user_id:user.id,logged_on:$('day').value,weight_kg:Number($('weight').value)},{onConflict:'user_id,logged_on'});if(r.error)msg('weightMsg',r.error.message,true);else{msg('weightMsg','Saved');await load()}};for(const id of ['targetCal','targetProtein']){$(id).value=localStorage.getItem('ff_'+id)||$(id).value;$(id).onchange=()=>{localStorage.setItem('ff_'+id,$(id).value);render()}}$('day').onchange=()=>{reset();load()};$('today').onclick=()=>{$('day').value=fmt(new Date());load()};for(const [id,n] of [['prev',-1],['next',1]])$(id).onclick=()=>{const d=new Date($('day').value+'T12:00:00');d.setDate(d.getDate()+n);$('day').value=fmt(d);load()};$('login').onsubmit=async e=>{e.preventDefault();if(!db)return;const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('authMsg',error.message,true);return}user=data.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('password').value='';await load()};$('logout').onclick=async()=>{await db?.auth.signOut();user=null;logs=[];$('app').classList.add('hidden');$('auth').classList.remove('hidden')};if(db)db.auth.getUser().then(async({data,error})=>{if(!error&&data.user){user=data.user;$('app').classList.remove('hidden');await load()}else $('auth').classList.remove('hidden')});else{ $('auth').classList.remove('hidden');msg('authMsg','Supabase library unavailable; check connection.',true)}
</script></body></html>
